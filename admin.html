<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Access Approvals / لوحة المسؤول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Cairo',sans-serif;background:#141414;color:#e5e5e5;min-height:100vh;padding:1.5rem}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:1.3rem;margin-bottom:1rem}
.ar{font-family:'Cairo',sans-serif}
.card{background:#1f1f1f;border:1px solid #333;border-radius:14px;padding:1.2rem;margin-bottom:1rem}
input{width:100%;padding:.7rem .9rem;border:2px solid #444;border-radius:10px;background:#111;color:#fff;font-size:1rem;font-family:inherit;direction:ltr}
.btn{background:#e60000;color:#fff;border:none;border-radius:10px;padding:.7rem 1.2rem;font-weight:700;cursor:pointer;font-family:inherit;font-size:.95rem}
.btn.ok{background:#0a7d34}.btn.no{background:transparent;border:1px solid #666;color:#ccc}
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.7rem 0;border-bottom:1px dashed #333}
.row:last-child{border:none}
.code{font-size:1.4rem;font-weight:800;letter-spacing:.25em;color:#fca5a5;direction:ltr}
.meta{font-size:.75rem;color:#999}
.actions{display:flex;gap:.5rem}
.err{color:#fca5a5;margin:.6rem 0}
.empty{color:#999;text-align:center;padding:1.5rem}
.hint{font-size:.8rem;color:#999;margin-top:1rem;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 Access approvals <span class="ar">/ الموافقة على الدخول</span></h1>
  <div class="card" id="loginCard">
    <input id="secret" type="password" placeholder="Admin secret (ADMIN_SECRET)" autocomplete="off">
    <div style="margin-top:.7rem"><button class="btn" onclick="login()">Show pending codes / عرض الطلبات</button></div>
    <div class="err" id="err"></div>
  </div>
  <div class="card" id="listCard" style="display:none">
    <div id="list"></div>
    <div style="margin-top:.8rem"><button class="btn no" onclick="load()">↻ Refresh / تحديث</button></div>
  </div>
  <div class="hint">Only you know ADMIN_SECRET. Share it with nobody — approving a code is what grants access. Codes expire: pending 7 days, approved 90 days. <span class="ar">محدش يعرف الـ ADMIN_SECRET غيرك — الموافقة على الكود هي اللي بتدي الدخول.</span></div>
</div>
<script>
let SECRET = sessionStorage.getItem('vf_admin') || '';
if(SECRET){ document.getElementById('secret').value = SECRET; login(); }
async function login(){
  SECRET = document.getElementById('secret').value.trim();
  if(!SECRET) return;
  sessionStorage.setItem('vf_admin', SECRET);
  await load();
}
async function load(){
  const err = document.getElementById('err');
  err.textContent = '';
  try{
    const r = await fetch('/api/admin-pending', {headers:{'x-admin-secret': SECRET}});
    const d = await r.json();
    if(!r.ok){ err.textContent = d.error === 'unauthorized' ? 'Wrong secret.' : ('Error: ' + (d.error || r.status)); return; }
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('listCard').style.display = 'block';
    const box = document.getElementById('list');
    if(!d.pending.length){ box.innerHTML = '<div class="empty">No pending requests / مفيش طلبات معلقة</div>'; return; }
    box.innerHTML = d.pending.map(p => {
      const when = p.createdAt ? new Date(p.createdAt).toLocaleString('en-GB') : '';
      return '<div class="row"><div><div class="code">' + p.code + '</div><div class="meta">' + when + '</div></div>' +
        '<div class="actions"><button class="btn ok" onclick="decide(\'' + p.code + '\',\'approve\')">Approve</button>' +
        '<button class="btn no" onclick="decide(\'' + p.code + '\',\'reject\')">Reject</button></div></div>';
    }).join('');
  }catch(e){ err.textContent = 'Network error.'; }
}
async function decide(code, action){
  await fetch('/api/admin-approve', {method:'POST', headers:{'Content-Type':'application/json','x-admin-secret': SECRET}, body: JSON.stringify({code, action})});
  load();
}
</script>
</body>
</html>
